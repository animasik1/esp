name: Build Windows EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile
      run: cl.exe /EHsc /Fe:css_esp.exe main.cpp /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: css_esp.exe
        tag_name: v1.0.0
        token: ${{ secrets.GITHUB_TOKEN }}
        
